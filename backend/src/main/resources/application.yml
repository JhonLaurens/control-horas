spring:
  application:
    name: control-horas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/controlhoras}
    username: ${DB_USER:controlhoras}
    password: ${DB_PASSWORD:controlhoras}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  web:
    locale: es
    locale-resolver: fixed
  jackson:
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  zone: ${APP_ZONE:America/Bogota}

logging:
  level:
    root: INFO
